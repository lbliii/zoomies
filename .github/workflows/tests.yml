name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14t"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          CI: true
          PYTHON_GIL: "0"
        run: |
          uv run poe test-parallel

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ty
        run: |
          uv run poe ty

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run lint
        run: |
          uv run poe lint

      - name: Run format check
        run: |
          uv run poe format-check

      - name: Ban silent exception patterns
        run: |
          echo "Checking for silent exception anti-patterns in src/..."
          FAILED=0

          # Ban contextlib.suppress in production code (allowed in tests)
          if grep -rn 'contextlib\.suppress' src/; then
            echo "::error::contextlib.suppress found in src/ — handle exceptions explicitly"
            FAILED=1
          fi

          # Ban 'or {}' after load/parse calls (masks failures)
          if grep -rn 'load_yaml\|load_json\|load_toml\|load_config' src/ | grep -q 'or {}'; then
            echo "::error::Found 'load_*(...) or {}' — do not mask load failures with fallback dicts"
            FAILED=1
          fi

          # Bare except blocks without logging, re-raise, or # silent: reason
          if grep -rn 'except.*:' src/ --include='*.py' | grep -v 'raise\|log\|logger\|warn\|# silent:' | grep -qE '(pass|continue)\s*$'; then
            echo "::error::Found except block with pass/continue but no logging or # silent: reason"
            FAILED=1
          fi

          exit $FAILED
