# Pre-commit hooks for Zoomies
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run poe format
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty type checker
        entry: uv run ty check src/zoomies/
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-silent-exceptions
        name: ban silent exception patterns
        entry: bash -c 'grep -rn "contextlib\.suppress" src/ && echo "ERROR: contextlib.suppress in src/" && exit 1; exit 0'
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
